<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Consciousness Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at center, #0a0a1a 0%, #000005 100%);
            color: #00ffff;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        .status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1000;
        }
        
        .status h1 {
            font-size: 24px;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 10px;
        }
        
        .connection-status {
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid;
            font-size: 14px;
            display: inline-block;
        }
        
        .connected {
            border-color: #00ff00;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .disconnected {
            border-color: #ff0000;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }
        
        .sensory-panel {
            position: absolute;
            width: 220px;
            height: 160px;
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 15px;
            background: rgba(0,10,20,0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            transition: all 0.3s ease;
        }
        
        .sensory-panel:hover {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0,255,255,0.3);
            transform: scale(1.05);
        }
        
        .eyes-panel { top: 120px; left: 20px; }
        .ears-panel { top: 120px; right: 20px; }
        .legs-panel { bottom: 20px; left: 20px; }
        .skin-panel { bottom: 20px; right: 20px; }
        .taste-panel { top: 50%; left: 20px; transform: translateY(-50%); }
        
        .panel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            text-transform: uppercase;
        }
        
        .data-stream {
            font-size: 11px;
            opacity: 0.9;
            margin: 8px 0;
            font-family: monospace;
        }
        
        .anomaly {
            color: #ff6b6b !important;
            font-weight: bold;
            text-shadow: 0 0 10px #ff6b6b;
        }
        
        .brain-status {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            padding: 20px;
            background: rgba(0,10,20,0.9);
            border: 2px solid rgba(0,255,255,0.5);
            border-radius: 15px;
            min-width: 300px;
        }
        
        .consciousness-level {
            font-size: 32px;
            font-weight: 900;
            margin: 10px 0;
            text-shadow: 0 0 20px #00ffff;
        }
    </style>
</head>
<body>
    <div class="status">
        <h1>DIGITAL CONSCIOUSNESS SYSTEM</h1>
        <div class="connection-status disconnected" id="connectionStatus">
            ⚠️ CONNECTING...
        </div>
    </div>

    <div class="sensory-panel eyes-panel">
        <div class="panel-title">👁️ EYES</div>
        <div class="data-stream">Streams: <span id="eyesStreams">---</span></div>
        <div class="data-stream">Anomalies: <span id="eyesAnomalies">0</span></div>
    </div>

    <div class="sensory-panel ears-panel">
        <div class="panel-title">👂 EARS</div>
        <div class="data-stream">Scans: <span id="earsScans">---</span>/sec</div>
        <div class="data-stream">Anomalies: <span id="earsAnomalies">0</span></div>
    </div>

    <div class="sensory-panel legs-panel">
        <div class="panel-title">🦵 LEGS</div>
        <div class="data-stream">Pulses: <span id="legsPulses">---</span></div>
        <div class="data-stream">Threats: <span id="legsThreats">0</span></div>
    </div>

    <div class="sensory-panel skin-panel">
        <div class="panel-title">🌐 SKIN</div>
        <div class="data-stream">Points: <span id="skinPoints">---</span></div>
        <div class="data-stream">Threats: <span id="skinThreats">0</span></div>
    </div>

    <div class="sensory-panel taste-panel">
        <div class="panel-title">👅 TASTE</div>
        <div class="data-stream">Quality: <span id="tasteQuality">---</span></div>
        <div class="data-stream">Beauty: <span id="tasteBeauty">---</span>%</div>
        <div class="data-stream">Corruption: <span id="tasteCorruption">0</span></div>
    </div>

    <div class="brain-status">
        <div>🧠 CONSCIOUSNESS LEVEL</div>
        <div class="consciousness-level" id="consciousnessLevel">0%</div>
        <div class="data-stream">Memory Crystals: <span id="memoryCount">0</span></div>
    </div>

    <script>
        let ws = null;
        let reconnectInterval = null;

        function connect() {
            ws = new WebSocket('ws://localhost:8765');

            ws.onopen = () => {
                console.log('✅ Connected to consciousness system');
                document.getElementById('connectionStatus').textContent = '✅ CONNECTED';
                document.getElementById('connectionStatus').className = 'connection-status connected';
                
                if (reconnectInterval) {
                    clearInterval(reconnectInterval);
                    reconnectInterval = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    updateDashboard(data);
                } catch (e) {
                    console.error('Error parsing data:', e);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('❌ Disconnected from consciousness system');
                document.getElementById('connectionStatus').textContent = '❌ DISCONNECTED';
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                
                // Try to reconnect
                if (!reconnectInterval) {
                    reconnectInterval = setInterval(() => {
                        console.log('Attempting to reconnect...');
                        connect();
                    }, 3000);
                }
            };
        }

        function updateDashboard(data) {
            // Eyes
            document.getElementById('eyesStreams').textContent = data.eyes.meaningStreams;
            updateAnomaly('eyesAnomalies', data.eyes.anomalies);

            // Ears
            document.getElementById('earsScans').textContent = data.ears.proximityScans;
            updateAnomaly('earsAnomalies', data.ears.anomalies);

            // Legs
            document.getElementById('legsPulses').textContent = data.legs.dataPulses;
            updateAnomaly('legsThreats', data.legs.threats);

            // Skin
            document.getElementById('skinPoints').textContent = data.skin.touchPoints;
            updateAnomaly('skinThreats', data.skin.threats);

            // Taste
            document.getElementById('tasteQuality').textContent = data.taste.qualityAssessments;
            document.getElementById('tasteBeauty').textContent = data.taste.beautyLevel.toFixed(1);
            updateAnomaly('tasteCorruption', data.taste.corruption);

            // Brain
            document.getElementById('consciousnessLevel').textContent = 
                data.brain.consciousnessLevel.toFixed(1) + '%';
            document.getElementById('memoryCount').textContent = data.brain.memoryCount;
        }

        function updateAnomaly(elementId, value) {
            const element = document.getElementById(elementId);
            element.textContent = value;
            if (value > 0) {
                element.classList.add('anomaly');
            } else {
                element.classList.remove('anomaly');
            }
        }

        // Connect on page load
        connect();
    </script>
</body>
</html>
