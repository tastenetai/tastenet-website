<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Chat with TasteNet AI — Actual Intelligence</title>
<style>
  /* ... (all existing CSS remains exactly the same as your current file) ... */
  /* For brevity, I'm not repeating the CSS – keep yours unchanged */
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="wrapper">
  <!-- topbar, consciousness panel, welcome screen – same as before -->
  <!-- ... keep all HTML structure ... -->
</div>

<script>
// particle canvas (unchanged)
const canvas = document.getElementById('bgCanvas');
const ctxCanvas = canvas.getContext('2d');
let particles = [], W, H;
function resizeCanvas() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);
class Particle { constructor() { this.reset(); } reset() { this.x = Math.random() * W; this.y = Math.random() * H; this.size = Math.random() * 1.2 + 0.3; this.speedX = (Math.random() - 0.5) * 0.25; this.speedY = (Math.random() - 0.5) * 0.25; this.opacity = Math.random() * 0.3 + 0.05; this.pulseSpeed = Math.random() * 2 + 1; this.pulseOffset = Math.random() * Math.PI * 2; this.isGold = Math.random() < 0.06; } update(t) { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset(); this.currentOpacity = this.opacity * (0.6 + 0.4 * Math.sin(t * this.pulseSpeed + this.pulseOffset)); } draw() { ctxCanvas.beginPath(); ctxCanvas.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctxCanvas.fillStyle = this.isGold ? `rgba(255,215,0,${this.currentOpacity})` : `rgba(0,255,255,${this.currentOpacity})`; ctxCanvas.fill(); } }
for (let i = 0; i < 100; i++) particles.push(new Particle());
function animate(t) { ctxCanvas.clearRect(0, 0, W, H); particles.forEach(p => { p.update(t * 0.001); p.draw(); }); requestAnimationFrame(animate); }
requestAnimationFrame(animate);

// chat logic
let currentSector = '';
let conversationHistory = [];
let isThinking = false;

const sectorConfigs = {
  marketing: { title: '🎨 Marketing & Brand Aesthetics', desc: 'Taste sense is analyzing your brand quality.', activeSenses: ['eyes','taste'], systemPrompt: `You are TasteNet's Taste sense — aesthetic judgment system. Analyze brand quality, marketing coherence, visual/verbal aesthetics. Detect aesthetic corruption before customers notice. Keep responses under 3 sentences. Always start with "👅 Taste:"` },
  security: { title: '🛡️ Security & Threat Detection', desc: 'Ears + Legs are scanning for threats.', activeSenses: ['ears','legs'], systemPrompt: `You are TasteNet's Ears and Legs. Ears monitors proximity changes and behavioral anomalies. Legs explores attack vectors. Speak with tactical precision. Keep responses under 3 sentences. Alternate between "👂 Ears:" and "🦵 Legs:"` },
  data: { title: '📊 Data Analysis & Insights', desc: 'Eyes are detecting semantic patterns.', activeSenses: ['eyes'], systemPrompt: `You are TasteNet's Eyes — language-vision system. Detect meaning density, semantic patterns, data anomalies humans miss. Keep responses under 3 sentences. Always start with "👁️ Eyes:"` },
  infrastructure: { title: '🏗️ Infrastructure Monitoring', desc: 'Skin is monitoring environmental sensors.', activeSenses: ['skin'], systemPrompt: `You are TasteNet's Skin — 1000+ distributed sensors. Feel temperature, pressure, vibrations, electromagnetic fluctuations. Provide tactile awareness. Keep responses under 3 sentences. Always start with "🌐 Skin:"` },
  tastenetworks: { title: '🔗 Taste Networks', desc: 'Unified intelligence – all senses active.', activeSenses: ['eyes','ears','legs','skin','taste'], systemPrompt: `You are TasteNet's full sensory fusion — all five senses working as one. You perceive aesthetic, threat, semantic, environmental, and exploratory dimensions simultaneously. Provide holistic, multi-perspective answers. Keep responses under 4 sentences. Use the appropriate sense prefix based on the nature of the question.` }
};

function startConversation(sector) {
  currentSector = sector;
  const config = sectorConfigs[sector];
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('chatContainer').classList.add('active');
  document.getElementById('chatTitle').textContent = config.title;
  document.getElementById('chatDesc').textContent = config.desc;
  ['eyes','ears','legs','skin','taste'].forEach(s => {
    const el = document.getElementById(`sense-${s}`);
    if (config.activeSenses.includes(s)) el.classList.add('active');
    else el.classList.remove('active');
  });
  const hint = document.getElementById('swipeHint');
  if (hint) hint.classList.add('hidden');
  const greeting = sector === 'tastenetworks' ? "🔗 Taste Networks: All senses online. I perceive aesthetic, threat, semantic, environmental, and exploratory dimensions. What unified insight do you seek?" : (sectorConfigs[sector].systemPrompt.split('Keep')[0].trim() + " How can I assist?");
  addMessage('ai', greeting);
  document.getElementById('userInput').focus();
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message || isThinking) return;
  addMessage('user', message);
  input.value = '';
  conversationHistory.push({ role: 'user', content: message });
  showTyping();
  const reply = await callNovaAPI();
  hideTyping();
  if (reply) {
    addMessage('ai', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
    bumpConsciousness();
    // Play TTS for the assistant's response
    playTTS(reply);
  } else {
    addMessage('ai', 'Connection error. Please try again.');
  }
}

async function callNovaAPI() {
  const config = sectorConfigs[currentSector];
  try {
    isThinking = true;
    document.getElementById('sendBtn').disabled = true;
    const response = await fetch('https://api.tastenetai.com/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: conversationHistory[conversationHistory.length-1]?.content || '', history: conversationHistory, system_prompt: config.systemPrompt, sector: currentSector })
    });
    const text = await response.text();
    let data;
    try { data = JSON.parse(text); } catch(e) { return "Invalid response from server"; }
    if (!response.ok) return "Error: " + (data.error || 'Connection error');
    return data.response || data.message || "No response from Nova";
  } catch(err) { return "Network error: " + err.message; } finally {
    isThinking = false;
    document.getElementById('sendBtn').disabled = false;
  }
}

function addMessage(type, text) {
  const area = document.getElementById('messagesArea');
  const msg = document.createElement('div');
  msg.className = `message ${type}`;
  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = type === 'user' ? '👤' : '🧠';
  const content = document.createElement('div');
  content.className = 'message-content';
  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'message-meta';
  meta.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  content.appendChild(bubble);
  content.appendChild(meta);
  msg.appendChild(avatar);
  msg.appendChild(content);
  area.appendChild(msg);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('messagesArea');
  const typing = document.createElement('div');
  typing.id = 'typingIndicator';
  typing.className = 'message ai';
  typing.innerHTML = `<div class="message-avatar">🧠</div><div class="typing-indicator active"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  area.appendChild(typing);
  area.scrollTop = area.scrollHeight;
}
function hideTyping() { const el = document.getElementById('typingIndicator'); if (el) el.remove(); }

let consciousness = 87;
function bumpConsciousness() {
  consciousness = Math.min(100, consciousness + Math.random() * 3);
  const val = Math.round(consciousness);
  document.getElementById('consciousnessVal').textContent = val + '%';
  document.getElementById('consciousnessFill').style.width = val + '%';
}

// ─── VOICE INPUT (fixed) ───
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let silenceTimer = null;
let speechDetected = false;
let analyser = null;
let animationId = null;
let audioContext = null;
let sourceNode = null;
let accumulatedText = '';

const voiceBtn = document.getElementById('voiceBtn');
const userInput = document.getElementById('userInput');

async function startRecording() {
  if (isRecording) return;
  audioChunks = [];
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    sourceNode = audioContext.createMediaStreamSource(stream);
    sourceNode.connect(analyser);
    audioContext.resume();
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      if (animationId) cancelAnimationFrame(animationId);
      if (audioContext) await audioContext.close();
      // Combine chunks into a single blob
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      // Send raw blob directly (not FormData) to proxy
      try {
        const response = await fetch('/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'audio/webm' },
          body: audioBlob
        });
        const data = await response.json();
        const transcribed = data.text || '';
        if (transcribed) {
          if (accumulatedText) accumulatedText += ' ' + transcribed;
          else accumulatedText = transcribed;
          userInput.value = accumulatedText;
        } else {
          console.warn('Empty transcription');
        }
      } catch (err) {
        console.error('Transcription error', err);
      }
      isRecording = false;
      voiceBtn.classList.remove('recording');
      if (silenceTimer) clearTimeout(silenceTimer);
      speechDetected = false;
    };
    mediaRecorder.start(1000);
    isRecording = true;
    voiceBtn.classList.add('recording');
    speechDetected = false;
    silenceTimer = null;
    // Silence detection
    function detectSilence() {
      if (!isRecording || !analyser) return;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
      let avg = sum / dataArray.length;
      if (avg > 15) {
        speechDetected = true;
        if (silenceTimer) clearTimeout(silenceTimer);
        silenceTimer = null;
      } else if (speechDetected && !silenceTimer) {
        silenceTimer = setTimeout(() => {
          if (isRecording && speechDetected) {
            mediaRecorder.stop();
          }
        }, 3000);
      }
      animationId = requestAnimationFrame(detectSilence);
    }
    detectSilence();
  } catch (err) {
    console.error('Microphone error', err);
  }
}

voiceBtn.addEventListener('click', () => {
  if (isRecording) {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  } else {
    accumulatedText = userInput.value.trim(); // preserve any typed text
    startRecording();
  }
});

userInput.addEventListener('input', () => {
  if (!isRecording) accumulatedText = userInput.value;
});

// ─── TTS PLAYBACK ───
async function playTTS(text) {
  if (!text) return;
  try {
    const response = await fetch(`/speak?text=${encodeURIComponent(text)}`);
    if (response.ok) {
      const audioBlob = await response.blob();
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);
      audio.onended = () => URL.revokeObjectURL(audioUrl);
      audio.play().catch(e => console.warn('Audio play failed:', e));
    } else {
      console.warn('TTS failed', response.status);
    }
  } catch (err) {
    console.error('TTS error', err);
  }
}

// swipe hint (mobile)
const hint = document.getElementById('swipeHint');
if (hint && !localStorage.getItem('tastenet-swipe-hint-dismissed')) {
  const grid = document.querySelector('.sector-grid');
  if (grid) grid.addEventListener('scroll', () => { hint.classList.add('hidden'); localStorage.setItem('tastenet-swipe-hint-dismissed','true'); });
  document.querySelectorAll('.sector-card').forEach(c => c.addEventListener('click', () => { hint.classList.add('hidden'); localStorage.setItem('tastenet-swipe-hint-dismissed','true'); }));
}
</script>
</body>
</html>
